<!-- Dentro del <body> -->
<div class="header-container">
  <h1>CaloríasFit</h1>
  <div class="day-nav">
    <button onclick="changeDay(-1)">‹</button>
    <input type="date" id="datePicker">
    <button onclick="changeDay(1)">›</button>
  </div>
</div>

<div id="meals"></div>

<div class="chart-card">
  <canvas id="weeklyChart"></canvas>
</div>

<div class="summary">
  <div class="kcal-highlight">
    <div id="totalKcal">0</div>
    <span>kcal consumidas</span>
  </div>

  <div class="macro-summary">
    <div class="macro-box">
      <div class="macro-title">Carbohidratos</div>
      <div id="carbsTotal" class="macro-value">0g</div>
    </div>
    <div class="macro-box">
      <div class="macro-title">Proteína</div>
      <div id="proteinTotal" class="macro-value">0g</div>
    </div>
    <div class="macro-box">
      <div class="macro-title">Grasas</div>
      <div id="fatTotal" class="macro-value">0g</div>
    </div>
  </div>

  <div class="goal-row">
    Meta: <input type="number" id="goalInput" class="goal-input" value="2000"> kcal
  </div>
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
</div>
